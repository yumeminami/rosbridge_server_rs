[package]
name = "rosbridge_server_rs"
version = "0.1.0"
edition = "2024"
license = "EPL-2.0 OR Apache-2.0"
description = "ROS 2 rosbridge WebSocket server implemented in Rust"

[features]
default = ["ros2"]
ros2 = ["dep:r2r_rcl", "dep:libloading"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
libloading = { version = "0.8", optional = true }
png = "0.17"
r2r_rcl = { version = "=0.9.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
