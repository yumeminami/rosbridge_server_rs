# Optional settings. Explicit command-line flags override this file.
# Start with: rosbridge_server_rs --config rosbridge.toml
address = "0.0.0.0"
port = 9090
url_path = "/"
node_name = "rosbridge_websocket"
namespace = "/"
max_message_size = 16777216
incoming_queue_size = 256
write_queue_size = 64
default_call_service_timeout = 30.0
fragment_timeout = 30.0
params_timeout = 5.0

# rosapi discovery filters; these are not protocol access-control rules.
# topics_glob = ["/head_mount/*", "/diagnostics"]
# params_glob = ["*"]

[log]
level = "info"
console = true
# Uncomment to also write logs to disk. Paths are relative to the working directory.
# directory = "logs"
rotation = "daily"
max_files = 7
