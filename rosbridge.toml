# Managed default at ~/.rosbridge_server_rs/rosbridge.toml; replaced on version changes.
# Keep persistent settings in another file and start with --config /path/to/file.toml.
# Explicit command-line flags override this file; --config selects another file.
address = "0.0.0.0"
port = 9090
url_path = "/"
node_name = "rosbridge_websocket"
namespace = "/"
max_message_size = 16777216
incoming_queue_size = 256
write_queue_size = 64
default_call_service_timeout = 30.0
fragment_timeout = 30.0
params_timeout = 5.0

# Forwarding allowlists. Omitted = unrestricted; [] = deny all.
# topics_glob is ADDED to both directional lists.
# For read-only monitoring, uncomment all five settings below.
# topics_glob = []
# topics_pub_glob = []
# topics_sub_glob = ["/diagnostics", "/imu", "/button"]
# services_glob = ["/rosapi/topics", "/rosapi/topics_and_raw_types", "/rosapi/topic_type", "/rosapi/message_details", "/rosapi/get_time", "/rosapi/get_ros_version"]
# params_glob = []

[log]
level = "info"
timezone = "local"
ansi = false
console = true
# Uncomment to also write logs to disk. Paths are relative to the working directory.
# directory = "logs"
rotation = "daily"
max_files = 7
