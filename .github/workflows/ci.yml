name: CI

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: protocol
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Rust format
        run: cargo fmt --check
      - name: Python format
        run: |
          python -m pip install black==23.1.0
          python -m black --check --line-length 100 benchmarks/*.py tests/*.py scripts/*.py
      - name: Shell syntax
        run: |
          for script in scripts/*.sh benchmarks/run.sh; do
            bash -n "$script"
          done
      - name: Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Protocol tests
        run: cargo test --locked --no-default-features
      - name: Compatibility runner tests
        run: python -m unittest discover -s tests -p test_parity_runner.py

  ros2:
    name: ROS 2 ${{ matrix.distro }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            distro: humble
            runner: ubuntu-24.04
          - arch: arm64
            distro: humble
            runner: ubuntu-24.04-arm
          - arch: x86_64
            distro: jazzy
            runner: ubuntu-24.04
          - arch: arm64
            distro: jazzy
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      ROSBRIDGE_SUITE_PATH: ${{ github.workspace }}/upstream
      ROS_DISTRO: ${{ matrix.distro }}
      CI_CONTAINER_SUFFIX: ${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout upstream test cases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobotWebTools/rosbridge_suite
          ref: aa9a7a33ddb3b1b45ddd6d2eead4c3d5eb800b14
          path: upstream
          persist-credentials: false
      - name: Build and test native ROS support
        shell: bash
        run: |
          mkdir -p ci-results
          bash scripts/ci_container.sh "${{ matrix.distro }}" 2>&1 | tee ci-results/ros2.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros2-${{ matrix.distro }}-results-${{ matrix.arch }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rosbridge_server_rs-${{ matrix.distro }}-${{ matrix.arch }}
          path: ci-results/dist/
          retention-days: 14
          if-no-files-found: error

  wheels:
    name: uv wheel (${{ matrix.arch }})
    needs: ros2
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.7'
      - name: Download tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" \
            --pattern 'rosbridge_server_rs-*-${{ matrix.arch }}' --dir dist
      - name: Build architecture wheel
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p wheel-bin/humble wheel-bin/jazzy wheel
          tar -xzf dist/rosbridge_server_rs-humble-${{ matrix.arch }}/*humble*.tar.gz \
            -C wheel-bin/humble
          tar -xzf dist/rosbridge_server_rs-jazzy-${{ matrix.arch }}/*jazzy*.tar.gz \
            -C wheel-bin/jazzy
          python3 scripts/package_wheel.py "$version" "${{ matrix.arch }}" \
            wheel-bin/humble/rosbridge_server_rs wheel-bin/jazzy/rosbridge_server_rs wheel
      - name: Test ROS distribution and architecture selection
        run: |
          for distro in humble jazzy; do
            docker run --rm \
              -e UV_TOOL_BIN_DIR=/tmp/uv-bin \
              -v "$(command -v uv):/usr/local/bin/uv:ro" \
              -v "$(command -v uvx):/usr/local/bin/uvx:ro" \
              -v "$PWD/wheel:/wheel:ro" \
              -v "$PWD/scripts:/scripts:ro" \
              "ros:$distro-ros-core" bash /scripts/test_wheel.sh
          done
      - name: Upload tested wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rosbridge_server_rs-wheel-${{ matrix.arch }}
          path: wheel/*.whl
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, ros2, wheels]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'rosbridge_server_rs-*' --dir dist
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat */SHA256SUMS-* > SHA256SUMS
          sha256sum */*.whl | sed 's#  .*/#  #' >> SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "$RELEASE_TAG" --notes-file ../docs/release-notes.md \
            */*.deb */*.tar.gz */*.whl SHA256SUMS

  pypi:
    name: Publish PyPI wheels
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, ros2, wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.7'
      - name: Download tested wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'rosbridge_server_rs-wheel-*' --dir dist
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*/*.whl
