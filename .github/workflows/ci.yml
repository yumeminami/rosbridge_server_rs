name: CI

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: protocol
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Rust format
        run: cargo fmt --check
      - name: Python format
        run: |
          python -m pip install black==23.1.0
          python -m black --check --line-length 100 benchmarks/*.py tests/*.py
      - name: Shell syntax
        run: |
          for script in scripts/*.sh benchmarks/run.sh; do
            bash -n "$script"
          done
      - name: Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Protocol tests
        run: cargo test --locked --no-default-features
      - name: Compatibility runner tests
        run: python -m unittest discover -s tests -p test_parity_runner.py

  ros2:
    name: ROS 2 Jazzy (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      ROSBRIDGE_SUITE_PATH: ${{ github.workspace }}/upstream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout upstream test cases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobotWebTools/rosbridge_suite
          ref: aa9a7a33ddb3b1b45ddd6d2eead4c3d5eb800b14
          path: upstream
          persist-credentials: false
      - name: Build and test native ROS support
        shell: bash
        run: |
          mkdir -p ci-results
          docker compose run --build --rm \
            -e ROSBRIDGE_TEST_RESULTS=/work/ci-results/upstream \
            test bash scripts/ci_ros.sh 2>&1 | tee ci-results/ros2.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros2-jazzy-results-${{ matrix.arch }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Package release binaries
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          docker compose run --rm -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            test bash scripts/package.sh
      - name: Test installation in a clean runtime container
        run: |
          docker run --rm \
            -v "$PWD/ci-results/dist:/dist:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/tests:/tests:ro" \
            ros:jazzy-ros-core bash /scripts/test_package.sh
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rosbridge_server_rs-linux-${{ matrix.arch }}
          path: ci-results/dist/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, ros2]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'rosbridge_server_rs-linux-*' --dir dist
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat */SHA256SUMS-* > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "$RELEASE_TAG" --notes-file ../docs/release-notes.md \
            */*.deb */*.tar.gz SHA256SUMS
